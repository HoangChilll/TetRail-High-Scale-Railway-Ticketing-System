name: TetRail CI - Auto Test & Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép kích hoạt thủ công trên giao diện GitHub Actions

jobs:
  # Kiểm tra biên dịch và chạy toàn bộ Unit Tests

  test:
    name:  Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Tự động cache ~/.m2 để tăng tốc các lần chạy sau

      - name:  Compile and Run Tests
        run: mvn clean test --batch-mode

      - name:  Upload Test Results
        if: always() # Luôn lưu lại report kể cả khi có test fail
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7

   #JOB 2: Đóng gói Artifact (Chỉ chạy khi Test PASS)
  build:
    name: 📦 Package Application
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name:  Package Multi-Module Project
        run: mvn package -DskipTests --batch-mode

      - name:  Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: start-application-jar
          path: start/target/*.jar
          retention-days: 7
